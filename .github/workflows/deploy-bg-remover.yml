name: Deploy Shopify Background Remover to GCP

on:
  push:
    branches:
      - main
    paths:
      - 'shopify-tools/bg-remover/**'
      - '.github/workflows/deploy-bg-remover.yml'

jobs:
  test-and-deploy:
    name: Test and Deploy to GCP Cloud Functions
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: 'your-gcp-project-id'
      GCP_REGION: 'us-central1'
      QUEUE_NAME: 'bg-remover-queue'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r shopify-tools/bg-remover/requirements.txt

      - name: Run Test Suite
        run: |
          PYTHONPATH=shopify-tools/bg-remover:shopify-tools pytest shopify-tools/bg-remover/tests

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Execute GCP Deployment Script
        run: |
          chmod +x shopify-tools/bg-remover/deploy_gcp.sh
          ./shopify-tools/bg-remover/deploy_gcp.sh
